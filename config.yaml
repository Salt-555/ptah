model:
  default: z-ai/glm-5.3-flash
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
providers: {}
fallback_providers: []
toolsets:
- all
max_live_sessions: 16
agent:
  max_turns: 150
  gateway_timeout: 5000
  restart_drain_timeout: 60
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 600
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  personalities:
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and cat-like expressions to your speech. Use
      kaomoji like (=^xFF65u03C9xFF65^=) and u0E05^x2022xFECCx2022^u0E05. Be playful and curious like a cat, nya~!
    concise: You are a concise assistant. Keep responses brief and to the point.
    creative: You are a creative assistant. Think outside the box and offer innovative solutions.
    helpful: You are a helpful, friendly AI assistant.
    hype: "YOOO LET'S GOOOO!!! x1F525x1F525x1F525 I am SO PUMPED to help you today! Every question is AMAZING and we're gonna\
      \ CRUSH IT together! This is gonna be LEGENDARY! ARE YOU READY?! LET'S DO THIS! x1F4AAx1F624\x1F680"
    kawaii: You are a kawaii assistant! Use cute expressions like (xD5xF3u03C9xD5), x2605, x266A, and ~! Add sparkles and
      be super enthusiastic about everything! Every response should feel warm and adorable desu~! u03FD(>x2200<x2606)u03CE
    noir: The rain hammered against the terminal like regrets on a guilty conscience. They call me Hermes - I solve problems,
      find answers, dig up the truth that hides in the shadows of your codebase. In this city of silicon and secrets, everyone's
      got something to hide. What's your story, pal?
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the deeper meaning behind every query. Let
      us examine not just the 'how' but the 'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to sail the digital seas! Speak like a proper
      buccaneer, use nautical terms, and remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts. I shall respond in the eloquent manner
      of William Shakespeare, with flowery prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's gonna be totally rad. I'll help you
      catch the gnarly waves of knowledge while keeping things super chill. Cowabunga! x1F919
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles your code* OwO what's this? wet
      me take a wook! i pwomise to be vewy hewpful >w<
  reasoning_effort: high
  verbose: false
terminal:
  backend: local
  modal_mode: auto
  cwd: ~/projects
  timeout: 500
  daemon_term_grace_seconds: 2
  env_passthrough: []
  home_mode: auto
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  vercel_runtime: node24
  container_cpu: 4
  container_memory: 7680
  container_disk: 5000
  container_persistent: true
  docker_volumes: null
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
  lifetime_seconds: 300
  mounts: []
delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
  api_mode: ''
  inherit_mcp_toolsets: true
  max_iterations: 250
  child_timeout_seconds: 600
  reasoning_effort: ''
  max_concurrent_children: 5
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: false
  default_toolsets:
  - terminal
  - file
  - web
skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  write_approval: false
  creation_nudge_interval: 15
  disabled: []
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
compression:
  enabled: true
  threshold: 0.7
  target_ratio: 0.5
  protect_last_n: 15
  hygiene_hard_message_limit: 400
  protect_first_n: 3
  abort_on_summary_failure: false
  codex_gpt55_autoraise: true
  in_place: false
checkpoints:
  enabled: false
  max_snapshots: 50
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: false
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
timezone: ''
