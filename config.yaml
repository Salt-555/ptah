model:
  default: ''
  provider: ''
  base_url: ''
providers: {}
fallback_providers: []
toolsets: []
max_live_sessions: 16
agent:
  max_turns: 150
  gateway_timeout: 5000
  restart_drain_timeout: 60
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 600
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: high
  verbose: false
terminal:
  backend: local
  modal_mode: auto
  cwd: ~/projects
  timeout: 500
  daemon_term_grace_seconds: 2
  env_passthrough: []
  home_mode: auto
  shell_init_files: []
  auto_source_bashrc: true
  docker_volumes: null
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
  lifetime_seconds: 300
  mounts: []
delegation:
  model: ''
  provider: ''
  base_url: ''
  api_key: ''
  api_mode: ''
  inherit_mcp_toolsets: true
  max_iterations: 250
  child_timeout_seconds: 600
  reasoning_effort: ''
  max_concurrent_children: 5
  max_spawn_depth: 2
  orchestrator_enabled: true
  subagent_auto_approve: false
  default_toolsets:
  - terminal
  - file
  - web
skills:
  external_dirs: []
  template_vars: true
  inline_shell: false
  inline_shell_timeout: 10
  guard_agent_created: false
  write_approval: false
  creation_nudge_interval: 15
  disabled: []
tool_output:
  max_bytes: 50000
  max_lines: 2000
  max_line_length: 2000
compression:
  enabled: true
  threshold: 0.7
  target_ratio: 0.5
  protect_last_n: 15
  hygiene_hard_message_limit: 400
  protect_first_n: 3
  abort_on_summary_failure: false
  in_place: false
checkpoints:
  enabled: true
  max_snapshots: 50
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24
  delete_orphans: true
timezone: ''
